name: Release

# Push a tag like `v2.1.0` and this workflow will:
#   1. Verify the tag matches the version in package.json
#   2. Publish the package to npm (provenance + OIDC trusted publishing)
#   3. Create a GitHub Release with the matching CHANGELOG section
#
# Auth: this repo is registered as a Trusted Publisher on npm for this
# package, so no NPM_TOKEN secret is needed. The npm CLI exchanges the
# workflow's OIDC token for a short-lived publish credential. Requires
# `id-token: write` permission (configured below).

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org/'
          cache: npm

      # OIDC trusted publishing requires npm ≥ 11.5.1. Node 22.x still ships
      # npm 10.x as bundled, so install the latest npm before publish.
      - name: Upgrade npm to a version that supports OIDC publish
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json version matches tag
        id: version
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

      - name: Build (sanity check)
        run: npm run build

      - name: Extract CHANGELOG entry for this version
        id: changelog
        run: |
          set -e
          # Section between this version header and the next.
          BODY=$(awk '/^## \[?[0-9]+\.[0-9]+\.[0-9]+/{count++; if(count==2) exit} count==1{print}' CHANGELOG.md)
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
