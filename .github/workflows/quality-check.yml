name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Build demo + verify outputs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x', '26.x']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the bundled demo
        run: npm run build

      - name: Verify expected artifacts exist
        run: |
          set -e
          test -f dist/index.html              # root redirect
          test -f dist/en/index.html
          test -f dist/fr/index.html
          test -f dist/en/404.html
          test -f dist/fr/404.html
          test -f dist/en/site.webmanifest
          test -f dist/fr/site.webmanifest
          test -f dist/sitemap-en.xml
          test -f dist/sitemap-fr.xml
          test -f dist/sitemap-index.xml
          echo "All expected artifacts present."

      - name: Smoke-check translations interpolated
        run: |
          # /en/ should contain English heading text, /fr/ the French one.
          grep -q 'Welcome' dist/en/index.html
          grep -q '<html lang="fr"' dist/fr/index.html

      - name: Single-locale fixture (no root redirect, no minify, de/index.html)
        working-directory: test/fixtures/single-locale
        run: |
          set -e
          npx vite build
          test -f dist/de/index.html
          test ! -e dist/index.html
          grep -q 'kept when minifyHtml is false' dist/de/index.html

      - name: Markdown pages render with frontmatter, ids, links and Eta
        working-directory: test/fixtures/single-locale
        run: |
          set -e
          grep -q '<title>Guide</title>' dist/de/guide.html
          grep -q '<h2 id="getting-started">' dist/de/guide.html
          grep -q 'more.html#details' dist/de/guide.html
          grep -q '&lt;%= not.evaluated %&gt;' dist/de/guide.html
          grep -q '<footer>fixture</footer>' dist/de/guide.html
          grep -q '<p>Hallo</p>' dist/de/more.html
          grep -q '<li>second</li>' dist/de/more.html
          test -f dist/de/img/dot.svg   # image next to the pages, under basePath

      - name: Single-locale fixture fails the build without a usable routes.config.json
        working-directory: test/fixtures/single-locale
        run: |
          mv routes.config.json routes.config.json.bak
          if npx vite build > build.log 2>&1; then
            echo "::error::vite build passed without routes.config.json"
            exit 1
          fi
          grep 'Cannot load .*routes.config.json' build.log || { cat build.log; exit 1; }
          echo '{ "basePath": {}, "routes": [] }' > routes.config.json
          if npx vite build > build.log 2>&1; then
            echo "::error::vite build passed with no basePath for locale de"
            exit 1
          fi
          grep 'basePath has no entry for locale "de"' build.log || { cat build.log; exit 1; }
          mv routes.config.json.bak routes.config.json
          rm build.log

      - name: Single-locale fixture fails the build on a broken page
        working-directory: test/fixtures/single-locale
        run: |
          printf '<%%= missing.value %%>\n' > src/pages/broken.eta
          if npx vite build; then
            echo "::error::vite build passed with a page that fails to render"
            exit 1
          fi
          rm src/pages/broken.eta
          printf -- '---\neta: true\n---\n<%%= missing.value %%>\n' > src/pages/broken.md
          if npx vite build; then
            echo "::error::vite build passed with a Markdown page that fails to render"
            exit 1
          fi

  pack:
    name: Verify npm pack contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dry-run npm pack and inspect tarball
        run: |
          set -e
          npm pack --dry-run
          # Hard requirements: plugin entry, templates, README, CHANGELOG, LICENSE.
          npm pack --dry-run --json > /tmp/pack.json
          for f in plugins/multi-locale-plugin.js \
                   plugins/templates/sitemap.xml.eta \
                   plugins/templates/404.html.eta \
                   plugins/utils/locale-utils.js \
                   plugins/utils/asset-processor.js \
                   README.md CHANGELOG.md LICENSE; do
            if ! grep -q "\"path\": \"$f\"" /tmp/pack.json; then
              echo "missing from tarball: $f"
              exit 1
            fi
          done
          echo "Tarball contents OK."
